packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: false
  workerd: true

blockExoticSubdeps: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - emdash
  - '@emdash-cms/*'

# Keep new admin extensions on the same Tiptap release as its existing editor.
overrides:
  '@tiptap/extension-subscript': 3.23.5
  '@tiptap/extension-superscript': 3.23.5
  '@astrojs/cloudflare>@cloudflare/vite-plugin': 1.39.0
