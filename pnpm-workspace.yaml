packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: false
  workerd: true

blockExoticSubdeps: true

minimumReleaseAge: 1440

# Keep one rule per package: pnpm uses its first matching rule.
# Version exceptions cover only releases still resolved in the lockfile.
minimumReleaseAgeExclude:
  - emdash
  - '@emdash-cms/*'
  - 'emdash-plugin-code-block-pro@0.2.0'
  - 'emdash-plugin-page-builder@0.3.0'
  - 'emdash-plugin-ai-comment-moderation@2.1.0'
