packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: false
  workerd: true

blockExoticSubdeps: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - emdash
  - '@emdash-cms/*'

patchedDependencies:
  '@emdash-cms/admin': patches/@emdash-cms__admin.patch
  emdash@0.14.0: patches/emdash@0.14.0.patch
