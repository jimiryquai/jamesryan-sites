name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-sites
  cancel-in-progress: false
  queue: max

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  staging:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ENV: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Reject stale CI runs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$STAGED_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter marketing-site exec wrangler deploy --env staging
      - run: pnpm --filter digital-garden exec wrangler deploy --env staging
      - name: Smoke test and trigger automatic D1 migrations
        run: node scripts/smoke-staging.mjs https://staging.jamesryan.dev https://staging.jamesryan.me
      - name: Verify D1 migrations
        run: |
          pnpm --filter marketing-site exec emdash migrate --check --wrangler-config wrangler.jsonc --wrangler-env staging
          pnpm --filter digital-garden exec emdash migrate --check --wrangler-config wrangler.jsonc --wrangler-env staging
      - name: Record staged commit
        env:
          STAGED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: printf '%s\n' "$STAGED_SHA" > staged-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-sha
          path: staged-sha.txt
          retention-days: 90

  identify-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.staged.outputs.sha }}
      run_id: ${{ steps.staged.outputs.run_id }}
    steps:
      - name: Resolve most recent successful staging run
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --event workflow_run --branch master --limit 1 --json databaseId,status,conclusion)
          test "$(echo "$run" | jq -r '.[0].status')" = completed
          test "$(echo "$run" | jq -r '.[0].conclusion')" = success
          id=$(echo "$run" | jq -r '.[0].databaseId')
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name staged-sha
          sha=$(cat staged-sha.txt)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          echo "Promoting staged commit $sha from run $id"
          echo "Approve staged commit \`$sha\` from staging run $id." >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: identify-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm staging has not changed since approval was requested
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RUN: ${{ needs.identify-staging.outputs.run_id }}
        run: |
          latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --event workflow_run --branch master --limit 1 --json databaseId,status,conclusion)
          test "$(echo "$latest" | jq -r '.[0].databaseId')" = "$APPROVED_RUN"
          test "$(echo "$latest" | jq -r '.[0].status')" = completed
          test "$(echo "$latest" | jq -r '.[0].conclusion')" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identify-staging.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter marketing-site exec wrangler deploy
      - name: Trigger and verify production D1 migrations
        run: |
          curl --fail --silent --show-error https://jamesryan.dev/ > /dev/null
          pnpm --filter marketing-site exec emdash migrate --check --wrangler-config wrangler.jsonc
